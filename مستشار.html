<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="ik-v" content="8442b289">
<!-- ⚠️ صَفحةُ HTML رابِطُها ثابِتٌ فَتُخَزَّنُ في المُتَصَفِّحِ رَغمَ النَشر — وحارِسُ الطَزاجةِ يَنقُلُ الزائِرَ إلى رابِطِ البَصمةِ الجَديدةِ مَرّةً واحِدة. -->
<script src="fresh.js?v=8442b289"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة إدارة المنصّة — الاعتماد الخارجي</title>
<link rel="stylesheet" href="style.css?v=8442b289">
<style>
  .adm{max-width:1500px;margin:0 auto;padding:18px 16px 70px}
  .adm h1{font-size:var(--fs-2xl);margin:0 0 4px}
  .adm .sub{color:var(--ink-2);margin-bottom:18px;font-size:var(--fs-sm)}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .bar .grow{flex:1 1 210px;min-width:180px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:11px;margin-bottom:20px}
  .kpi-b{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px 15px}
  .kpi-b .v{font-size:var(--fs-2xl);font-weight:800;line-height:1.25;color:var(--brand)}
  .kpi-b .l{font-size:var(--fs-sm);color:var(--ink-2);margin-top:2px}
  .kpi-b.warn .v{color:#a97c1f} .kpi-b.bad .v{color:#a32b22} .kpi-b.ok .v{color:#1d7a52}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin-bottom:16px}
  .tab{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;
       padding:10px 15px;font:inherit;font-weight:700;color:var(--ink-2);cursor:pointer;min-height:44px}
  .tab.on{color:var(--brand);border-bottom-color:var(--brand)}
  .tab .n{background:var(--brand-soft,#e9f3f0);border-radius:20px;padding:1px 8px;font-size:var(--fs-xs);margin-inline-start:6px}
  .tab.alert .n{background:#fdecec;color:#a32b22}
  /* ⚠️ المُصفّيات كانت تتكدّس أربعة أسطر فتلتهم نصف الشاشة قبل أوّل مدرسة —
     لأن `.f-in` عرضها 100%. عرضٌ محدود لكلٍّ فتنتظم في سطر، وتنكسر على
     الجوّال وحده حيث لا يتّسع السطر أصلًا. */
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px;align-items:center}
  .filters select{flex:0 0 auto;width:auto;min-width:110px;max-width:168px}
  .filters input{flex:1 1 200px;min-width:150px;max-width:330px}
  .filters select,.filters input{min-height:38px;font-size:var(--fs-sm);padding-block:6px}
  @media(max-width:720px){.filters select{flex:1 1 44%;max-width:none}
    .filters input{flex:1 1 100%;max-width:none}}
  /* المطلوب تعبئته حاجبٌ للدخول — لونٌ ينبّه لا يُهمَل */
  .g-chip.need{background:#fdecec;color:#a32b22;border:1px solid #f2b8b8}
  /* ⚠️ هرمية داخل الجدول نفسه: اسم المدرسة هو المعرّف فيأخذ الدرجة الأعلى،
     وبقيّة الخلايا أرقامٌ ووسومٌ تُقرأ بالمسح لا بالقراءة فتنزل درجة. وكان
     الاسم غليظًا بحجم البيانات نفسه فبدا أثقل ممّا ينبغي — واللون صار يحمل
     التمييز فلم يعد الغلظ لازمًا. */
  table.adm-t{width:100%;border-collapse:collapse;font-size:var(--fs-xs);background:var(--panel);
              border:1px solid var(--line);border-radius:13px;overflow:hidden}
  table.adm-t th,table.adm-t td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:center;vertical-align:middle}
  table.adm-t th{background:var(--brand-soft,#e9f3f0);color:var(--brand-ink,#0d443a);font-weight:700;
                 cursor:pointer;user-select:none;white-space:nowrap}
  table.adm-t td.r{text-align:right}
  table.adm-t tbody tr{cursor:pointer}
  table.adm-t tbody tr:hover{background:var(--brand-soft,#e9f3f0)}
  .pill{display:inline-block;border-radius:20px;padding:2px 9px;font-size:var(--fs-xs);font-weight:700;white-space:nowrap}
  .p-ok{background:#e6f5ee;color:#1d7a52} .p-warn{background:#fdf3e0;color:#a97c1f}
  .p-bad{background:#fdecec;color:#a32b22} .p-gray{background:var(--soft,#eef1f3);color:var(--ink-2)}
  .side{position:fixed;inset-block:0;inset-inline-start:0;width:min(560px,94vw);background:var(--panel);
        border-inline-end:1px solid var(--line);box-shadow:0 0 34px #0003;z-index:40;overflow:auto;padding:20px}
  .side.hidden{display:none}
  /* عَمَلُ المَنسوبِ بِجانِبِ اسمِه — رَقَمانِ لا جَدوَلٌ ثانٍ */
  .prow .wk{font-variant-numeric:tabular-nums;opacity:.9}
  .b-xs{min-height:28px;padding-inline:10px;font-size:var(--fs-2xs)}
  /* ⚠️ اللوحة كانت بخطٍّ كبير فلا يظهر منها إلّا أربعة منسوبين — والمقصود
     رؤيتهم جميعًا بنظرة. صُغِّر كل شيء بمقدارٍ محسوب، والهدف اللمسي محفوظ. */
  .side h2{margin:0 0 3px;font-size:var(--fs-md)}
  .side .side-h{font-size:var(--fs-sm);margin:14px 0 2px;color:var(--ink-2)}
  .side .muted{font-size:var(--fs-xs)}
  .side .kpi-b{padding:9px 11px}
  .side .kpi-b .v{font-size:var(--fs-lg)}
  .side .kpi-b .l{font-size:var(--fs-micro)}
  .side-note{background:var(--soft,#eef1f3);border-radius:9px;padding:9px 12px;
    font-size:var(--fs-xs);line-height:1.7;color:var(--ink-2);margin-bottom:12px}
  .prow{padding:7px 0;gap:7px}
  .prow .who b{font-size:var(--fs-sm)}
  .prow .who span{font-size:var(--fs-micro);line-height:1.5}
  .prow .pill{font-size:var(--fs-micro);padding:1px 7px}
  .prow .acts{gap:5px}
  .prow .b-xs{padding:4px 9px;font-size:var(--fs-micro);min-height:30px}
  .side .close{position:absolute;inset-block-start:14px;inset-inline-end:16px;background:none;border:0;
               font-size:var(--fs-xl);cursor:pointer;color:var(--ink-2);min-height:44px;min-width:44px}
  .prow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;
        border-bottom:1px solid var(--line);padding:10px 0}
  .prow .who b{display:block;font-size:var(--fs-sm)}
  .prow .who span{font-size:var(--fs-xs);color:var(--ink-2)}
  .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .b-xs{padding:6px 11px;font-size:var(--fs-xs);min-height:38px;border-radius:9px}
  .scrim{position:fixed;inset:0;background:#0006;z-index:39}.scrim.hidden{display:none}
  .howto{background:#fff8e6;border:1px solid #e8d5a3;border-radius:11px;padding:12px 15px;
         margin:12px 0;font-size:var(--fs-sm);line-height:1.8}
  .mail{font-family:inherit;background:var(--soft,#eef1f3);border-radius:7px;padding:2px 8px;
        font-size:var(--fs-sm);unicode-bidi:plaintext;direction:ltr;display:inline-block}
  .empty{text-align:center;color:var(--ink-2);padding:40px 20px;font-size:var(--fs-base)}
  @media(max-width:640px){ .adm{padding:12px 10px 60px} table.adm-t{font-size:var(--fs-xs)}
    table.adm-t th,table.adm-t td{padding:7px 6px} .hide-sm{display:none} }
  /* ── عائلة ألوان المراحل: لكل مرحلة لون، والمسار درجتان منه ──
     ⚠️ اللون على **النصّ** لا على خلفية الصفّ: خلفياتٌ ملوّنة لأربع مراحل
     تجعل الجدول لوحةً لا جدولًا، وتُخفي تمييز الصفّ عند المرور والاختيار. */
  /* ⚠️ **المَسارُ يُحَدِّدُ العائِلةَ اللَونيةَ والمَرحَلةُ تُحَدِّدُ الدَرَجة**
     (رَصدُ المُستَشار 2026-09-07: «ما زالَت أَسماءُ الوَطَنيِّ بِنَفسِ لَونِ
     العالَمي»). كانَ التَلوينُ **بِالمَرحَلةِ وَحدَها**، والعالَميُّ يُمَيَّزُ
     بِـ`opacity:.78` — فَرقٌ لا تَكادُ العَينُ تَراهُ في نَصٍّ صَغيرٍ غَليظ.
     الآنَ: الوَطَنيُّ أَخضَرُ والعالَميُّ أَزرَق، وأَربَعُ دَرَجاتٍ بِالمَرحَلةِ
     تَغمَقُ صُعوداً (رِياض ⟵ ثانَوي).
     ⚠️ **وكُلُّ الدَرَجاتِ الثَماني مَقيسةٌ ≥4.5:1 على الأَبيَض** — أَوَّلُ
     مُقتَرَحٍ سَقَطَت فيهِ الرَوضةُ عِندَ 4.0 فَغُمِّقَت. اللَونُ الجَميلُ الذي
     لا يُقرَأُ عَيبٌ لا ذَوق. */
  /* ⚠️ **الدَرَجةُ اللَونيةُ هيَ الفارِق، لا العَتامةُ ولا القَتامة.** كانَ
     الأَخضَرُ 151° والأَزرَقُ 213° مُتَقارِبَينِ في القَتامةِ فَقَرَأَتهُما
     العَينُ لَونًا واحِدًا في نَصٍّ صَغيرٍ غَليظ (رَصدُ المُستَشار مَرَّتَين).
     الآنَ **62° بَينَ العائِلَتَين**: 152° أَخضَرُ صَريحٌ و214° أَزرَقُ صَريح،
     وأَربَعُ دَرَجاتٍ تَغمَقُ بِالمَرحَلةِ داخِلَ كُلِّ عائِلة.
     وكُلُّ الثَمانِ مَقيسةٌ ≥4.6:1 على **أَسوَأِ** خَلفياتِ الجَدوَلِ الثَلاث
     (الأَبيَض · الصَفحة #f2f6f5 · تَظليلُ المُرور #e9f3f0) لا على الأَبيَضِ
     وَحدَه — فَالصَفُّ تَحتَ المُؤَشِّرِ هوَ أَخفَضُها تَبايُنًا. */
  tr.tr-nat.st-kg   .sch b, tr.tr-nat.st-kg   .stg{color:#15794b}
  tr.tr-nat.st-pri  .sch b, tr.tr-nat.st-pri  .stg{color:#126840}
  tr.tr-nat.st-mid  .sch b, tr.tr-nat.st-mid  .stg{color:#0f5233}
  tr.tr-nat.st-high .sch b, tr.tr-nat.st-high .stg{color:#0b4128}
  tr.tr-int.st-kg   .sch b, tr.tr-int.st-kg   .stg{color:#266bc5}
  tr.tr-int.st-pri  .sch b, tr.tr-int.st-pri  .stg{color:#205aa7}
  tr.tr-int.st-mid  .sch b, tr.tr-int.st-mid  .stg{color:#194885}
  tr.tr-int.st-high .sch b, tr.tr-int.st-high .stg{color:#143a6b}
  /* احتِياطٌ لِصَفٍّ بِلا صِنفِ مَسار — لَونٌ مُحايِدٌ لا وَراثةٌ عَمياء */
  tr:not(.tr-nat):not(.tr-int) .sch b,
  tr:not(.tr-nat):not(.tr-int) .stg{color:#475569}
  tr.tr-int  .trk{font-style:italic}
  /* ⚠️ **سَطرٌ واحِدٌ بِلا التِفاف** بِطَلَبِ المُستَشار: الاسمُ المُلتَفُّ
     يُضاعِفُ ارتِفاعَ الصَفِّ فَيَقِلُّ ما يُرى مِنَ المَدارِسِ في الشاشة.
     والفائِضُ يَنزَلِقُ داخِلَ `.tbl-wrap` (overflow-x:auto) لا يَدفَعُ الصَفحة. */
  .sch b{font-size:var(--fs-sm);font-weight:600;border-inline-start:3px solid currentColor;
         padding-inline-start:8px;display:inline-block;line-height:1.5;white-space:nowrap}
  /* ⚠️ **بَنين بُنّيٌّ وبَنات أَحمَرُ قاتِمٌ داخِلَ الاسمِ نَفسِه.** قاعِدةٌ
     مُباشِرةٌ على الوَسمِ تَغلِبُ لَونَ العائِلةِ المَوروثَ مِنَ `b` بِلا
     مُزايَدةٍ في التَخصيص. و28° و358° بَعيدَتانِ عَن 152° و214° فَلا تَختَلِطُ
     بِعائِلَتَي المَسار، وكِلتاهُما ≥5.5:1 على أَسوَأِ خَلفياتِ الجَدوَل. */
  .g-m{color:#834e21}
  .g-f{color:#8b181c}
  .adm-t td.r{line-height:1.5}
  .stg{font-weight:700;font-size:var(--fs-xs);white-space:nowrap}
  /* مفتاح الألوان — لونٌ بلا مفتاح لغز */
  .lg-h{font-size:var(--fs-xs)}.lg-h b{color:var(--ink)}
  .lg-sep{border-inline-start:1px solid var(--line);padding-inline-start:12px;margin-inline-start:4px}
  .rd{font-weight:800;font-size:var(--fs-sm)}
  .rd-ok{color:#1d7a52}.rd-mid{color:#12508a}.rd-low{color:#a97c1f}.rd-st{color:#a32b22}
  .rd-box{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
  .rd-num{font-size:var(--fs-num);font-weight:800;line-height:1;margin-bottom:9px}
  .rd-row{display:flex;align-items:center;gap:8px;font-size:var(--fs-xs);margin-bottom:4px}
  .rd-row span:first-child{min-width:104px}
  .rd-row .bar-m{flex:1}
  .legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:0 0 11px;font-size:var(--fs-xs)}
  .legend b{font-weight:700}
  .legend .k{display:inline-flex;align-items:center;gap:5px}
  .legend .sw{width:11px;height:11px;border-radius:3px;display:inline-block}
  @media print{ .bar,.tabs,.filters,.side,.scrim,.b-main,.b-ghost{display:none!important}
    .adm{max-width:none} table.adm-t{font-size:9.5pt} }
</style>
</head>
<body>
<div class="adm">
  <h1>لوحة إدارة المنصّة</h1>
  <p class="sub" id="who">مدير التخطيط والجودة · مدارس ابن خلدون — الاعتماد الخارجي</p>

  <div class="bar">
    <button class="b-main" id="pick">📂 اختر مجلد «مساحة الاعتماد ١٤٤٨»</button>
    <button class="b-ghost hidden" id="rescan">↻ إعادة الفحص</button>
    <button class="b-ghost hidden" id="csv">⬇️ تصدير جدول</button>
    <button class="b-ghost hidden" id="print">🖨️ طباعة</button>
    <span style="flex:1"></span>
    <!-- ⚠️ اللوحة كانت طريقًا مسدودًا: لا رابط يعود إلى الموقع ولا إلى الدليل -->
    <a class="b-ghost" href="index.html" title="موقع الاعتماد">🏠 الموقع</a>
    <span class="muted" id="status"></span>
  </div>
  <div class="prog hidden" id="prog"><span></span></div>
  <div id="intro"></div>

  <div class="hidden" id="main">
    <div class="kpis" id="kpis"></div>
    <div class="tabs" id="tabs"></div>
    <div class="legend hidden" id="legend">
      <!-- ⚠️ المِفتاحُ كانَ يَعرِضُ لَوحةً مَهجورة (بَنَفسَجي/بُرتُقالي بِالمَرحَلةِ
           وَحدَها) والجَدوَلُ يَرسُمُ بِعائِلَتَي المَسار — فَمِفتاحٌ يُكَذِّبُ جَدوَلَهُ
           أَسوَأُ مِن لا مِفتاح. يُشتَقُّ مِنَ اللَوحةِ نَفسِها ويُحدَّثُ مَعَها. -->
      <span class="k lg-h"><b>وطني</b></span>
      <span class="k"><span class="sw" style="background:#15794b"></span>رياض</span>
      <span class="k"><span class="sw" style="background:#126840"></span>ابتدائي</span>
      <span class="k"><span class="sw" style="background:#0f5233"></span>متوسط</span>
      <span class="k"><span class="sw" style="background:#0b4128"></span>ثانوي</span>
      <span class="k lg-h lg-sep"><b>عالمي</b></span>
      <span class="k"><span class="sw" style="background:#266bc5"></span>رياض</span>
      <span class="k"><span class="sw" style="background:#205aa7"></span>ابتدائي</span>
      <span class="k"><span class="sw" style="background:#194885"></span>متوسط</span>
      <span class="k"><span class="sw" style="background:#143a6b"></span>ثانوي</span>
      <span class="k lg-h lg-sep"><b>داخل الاسم</b></span>
      <span class="k"><span class="sw" style="background:#834e21"></span>بَنين</span>
      <span class="k"><span class="sw" style="background:#8b181c"></span>بَنات</span>
    </div>
    <div class="filters hidden" id="filters">
      <input class="f-in grow" id="q" placeholder="ابحث باسم مدرسة أو منسوب…" autocomplete="off">
      <select class="f-in" id="fComplex"><option value="">كل المجمعات</option></select>
      <select class="f-in" id="fTrack"><option value="">كل المسارات</option></select>
      <select class="f-in" id="fStage"><option value="">كل المراحل</option></select>
      <select class="f-in" id="fState">
        <option value="">كل الحالات</option>
        <option value="active">بدأت العمل</option>
        <option value="idle">لم تبدأ بعد</option>
        <option value="attention">⚠️ يحتاج انتباهك</option>
        <option value="missing">فيها أسماء ناقصة</option>
      </select>
    </div>
    <div id="body"></div>
  </div>
</div>

<div class="scrim hidden" id="scrim"></div>
<aside class="side hidden" id="side"></aside>

<script type="module" src="admin-ui.js?v=8442b289"></script>
</body>
</html>
